<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Islander Motel audits{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    body { overflow-x: hidden; }
    nav.steps { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.5rem; }
    nav.steps a { margin: 0; }
    .item { border: 1px solid var(--pico-muted-border-color); border-radius: .5rem;
            padding: .75rem 1rem; margin-bottom: 1rem; }
    .item h4 { margin-bottom: .25rem; }
    .item .item-note { color: var(--pico-muted-color); font-size: .9rem; margin-bottom: .5rem; }
    .check { padding: .5rem 0; border-top: 1px dashed var(--pico-muted-border-color); }
    .check:first-of-type { border-top: 0; }
    .check-label { font-weight: 600; margin-right: .5rem; }
    .btn-row { display: flex; flex-wrap: wrap; gap: .5rem; margin: .35rem 0; }
    .btn-row button { margin: 0; min-height: 3.25rem; min-width: 5rem; width: auto;
                      font-size: 1.05rem; }
    .btn-row button.good.selected { background: #2e7d32; border-color: #2e7d32; color: #fff; }
    .btn-row button.neutral.selected { background: #546e7a; border-color: #546e7a; color: #fff; }
    .btn-row button.bad.selected { background: #c62828; border-color: #c62828; color: #fff; }
    .btn-row button.bucket.selected { background: #1565c0; border-color: #1565c0; color: #fff; }
    .tag { display: inline-block; padding: .1rem .5rem; border-radius: 1rem; font-size: .8rem;
           background: var(--pico-muted-border-color); }
    .tag.unanswered { background: #ffe0b2; color: #5d4037; }
    .tag.pass { background: #c8e6c9; color: #1b5e20; }
    .tag.fail { background: #ffcdd2; color: #b71c1c; }
    .details-box { margin-top: .5rem; }
    .details-box textarea, .details-box input { margin-bottom: .35rem; }
    .saved-note { font-size: .8rem; color: var(--pico-muted-color); }
    .thumb { max-height: 6rem; border-radius: .25rem; }
    .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .75rem;
               align-items: end; }
    .filters > * { margin-bottom: 0; }
    td select { margin: 0; padding-top: .3rem; padding-bottom: .3rem; }
    .num { text-align: right; }
    .rating label { display: inline-block; margin-right: 1rem; font-size: 1.1rem; }

    /* Phone layout */
    @media (max-width: 600px) {
      header nav { flex-direction: column; align-items: flex-start; }
      header nav ul { flex-wrap: wrap; margin: 0; }
      header nav li { padding: .35rem .6rem .35rem 0; }
      h2 { font-size: 1.4rem; }
      nav.steps a { flex: 1 1 45%; text-align: center; padding: .6rem .4rem; }
      .item { padding: .6rem .7rem; }
      .btn-row button { flex: 1 1 30%; min-width: 0; padding-left: .4rem; padding-right: .4rem; }
      .rating label { margin-right: 1.5rem; font-size: 1.25rem; }
      /* Tables become one card per row, with the column name beside each value. */
      table.stack thead { display: none; }
      table.stack tr { display: block; border: 1px solid var(--pico-muted-border-color);
                       border-radius: .5rem; margin-bottom: .75rem; padding: .25rem .5rem; }
      table.stack td { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
                       border: 0; padding: .3rem .25rem; text-align: right; }
      table.stack td::before { content: attr(data-label); font-weight: 600; text-align: left; flex: none; }
      table.stack td select { max-width: 60%; }
    }
  </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="container">
    <nav>
      <ul><li><strong>Islander Motel audits</strong></li></ul>
      {% if user.is_authenticated %}
      <ul>
        <li><a href="{% url 'home' %}">Audits</a></li>
        <li><a href="{% url 'issue_list' %}">Issues</a></li>
        <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
        <li><a href="{% url 'admin:index' %}">Admin</a></li>
        <li>
          <form method="post" action="{% url 'logout' %}" style="margin:0">
            {% csrf_token %}
            <button type="submit" class="outline secondary" style="margin:0;padding:.25rem .75rem">Log out</button>
          </form>
        </li>
      </ul>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% if messages %}
      {% for message in messages %}<article>{{ message }}</article>{% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
